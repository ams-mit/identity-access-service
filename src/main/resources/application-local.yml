spring:
  datasource:
    url: ${DB_URL:jdbc:mysql://localhost:3306/identity_db}
    username: ${DB_USERNAME:identity_user}
    password: ${DB_PASSWORD:identity_pass}
jwt:
  private-key-path: ${JWT_PRIVATE_KEY_PATH:classpath:certs/private_key.pem}
  public-key-path: ${JWT_PUBLIC_KEY_PATH:classpath:certs/public_key.pem}
  expiration-seconds: 3600
auth:
  password-reset:
    token-validity-minutes: 30

