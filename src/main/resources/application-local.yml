spring:
  datasource:
    url: ${DB_URL:jdbc:mysql://localhost:3306/identity_db}
    username: ${DB_USERNAME:identity_user}
    password: ${DB_PASSWORD:identity_pass}
  mail:
    host: ${SMTP_HOST:smtp.gmail.com}
    port: ${SMTP_PORT:587}
    username: ${SMTP_USERNAME:}
    password: ${SMTP_PASSWORD:${SMTP_APP_PASSWORD:}}
jwt:
  private-key-path: ${JWT_PRIVATE_KEY_PATH:}
  public-key-path: ${JWT_PUBLIC_KEY_PATH:}
  expiration-seconds: 1800
  service-token-expiration-seconds: ${JWT_SERVICE_TOKEN_EXPIRATION_SECONDS:300}
auth:
  password-reset:
    token-validity-minutes: 30

