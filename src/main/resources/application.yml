spring:
  application:
    name: identity-access-service
  profiles:
    active: local
  jpa:
    hibernate:
      ddl-auto: none
    show-sql: false
  flyway:
    enabled: true
  mail:
    host: ${SMTP_HOST:smtp.gmail.com}
    port: ${SMTP_PORT:587}
    username: ${SMTP_USERNAME:}
    password: ${SMTP_PASSWORD:${SMTP_APP_PASSWORD:}}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true
server:
  port: ${SERVER_PORT:8080}
springdoc:
  swagger-ui:
    path: /swagger-ui.html
jwt:
  private-key-path: ${JWT_PRIVATE_KEY_PATH:}
  public-key-path: ${JWT_PUBLIC_KEY_PATH:}
  gateway-public-key-path: ${GATEWAY_JWT_PUBLIC_KEY_PATH:${GATEWAY_JWT_PUBLIC_KEY:}}
  gateway-public-key: ${GATEWAY_JWT_PUBLIC_KEY:}
  expiration-seconds: 1800
  service-token-expiration-seconds: ${JWT_SERVICE_TOKEN_EXPIRATION_SECONDS:300}
internal-api:
  allowed-callers:
    user-validation:
      - resident-management-service
      - lease-occupancy-service
      - billing-payment-service
      - utility-charge-service
      - operations-service
      - community-service
      - property-unit-service
auth:
  password-reset:
    token-validity-minutes: ${PASSWORD_RESET_TOKEN_VALIDITY_MINUTES:30}
management:
  health:
    mail:
      enabled: false
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true
      show-details: never

