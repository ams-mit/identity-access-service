spring:
  application:
    name: identity-access-service
  profiles:
    active: local
  jpa:
    hibernate:
      ddl-auto: none
    show-sql: false
  flyway:
    enabled: true
server:
  port: ${SERVER_PORT:8080}
springdoc:
  swagger-ui:
    path: /swagger-ui.html
jwt:
  private-key-path: ${JWT_PRIVATE_KEY_PATH:classpath:certs/private_key.pem}
  public-key-path: ${JWT_PUBLIC_KEY_PATH:classpath:certs/public_key.pem}
  expiration-seconds: 1800
  service-token-expiration-seconds: ${JWT_SERVICE_TOKEN_EXPIRATION_SECONDS:300}
auth:
  password-reset:
    token-validity-minutes: ${PASSWORD_RESET_TOKEN_VALIDITY_MINUTES:30}
management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true
      show-details: never

