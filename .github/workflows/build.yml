name: Build and Test
on:
  pull_request:
    branches: [ develop, main ]
  push:
    branches: [ develop ]
jobs:
  build:
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: identity_db_test
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5
    steps:
      - uses: actions/checkout@v4
      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
      # Automated tests dynamically generate ephemeral RSA keys (RS256) at test runtime.
      # Production environments must provision real RSA keypairs via secrets management (JWT_PRIVATE_KEY_PATH / JWT_PUBLIC_KEY_PATH).
      - name: Build and run tests
        run: ./mvnw clean verify
        env:
          SPRING_DATASOURCE_URL: jdbc:mysql://localhost:3306/identity_db_test
          SPRING_DATASOURCE_USERNAME: root
          SPRING_DATASOURCE_PASSWORD: root
